# Atlas of Life — Apache vhost.
#
# One hostname serves the whole Atlas surface:
#   /               Atlas Studio (desktop, static)
#   /capture/       Atlas Capture PWA (phone, static)
#   /v1/*, /health  Atlas Sync API (proxied to the loopback Node service)
# Same origin for the app and the API — no CORS on real devices.
<VirtualHost *:80>
    ServerName __ATLAS_HOSTNAME__

    DocumentRoot /opt/atlas-sync/app
    <Directory /opt/atlas-sync/app>
        Require all granted
        Options -Indexes
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /v1/ http://127.0.0.1:8787/v1/ connectiontimeout=5 timeout=30
    ProxyPassReverse /v1/ http://127.0.0.1:8787/v1/
    ProxyPass        /health http://127.0.0.1:8787/health connectiontimeout=5 timeout=30
    ProxyPassReverse /health http://127.0.0.1:8787/health

    ErrorLog ${APACHE_LOG_DIR}/atlas-sync-error.log
    CustomLog ${APACHE_LOG_DIR}/atlas-sync-access.log combined

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
</VirtualHost>

<VirtualHost *:80>
    ServerName atlas.31.28.27.96.sslip.io

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8787/ connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:8787/

    ErrorLog ${APACHE_LOG_DIR}/atlas-sync-error.log
    CustomLog ${APACHE_LOG_DIR}/atlas-sync-access.log combined

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
</VirtualHost>

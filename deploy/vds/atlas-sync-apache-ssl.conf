# Atlas of Life — managed HTTPS vhost.
#
# Certbot owns the certificate lifecycle. This file owns the application
# routing so an older Certbot-generated API-only vhost cannot survive an
# application upgrade.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName __ATLAS_HOSTNAME__

    DocumentRoot /opt/atlas-sync/app
    <Directory /opt/atlas-sync/app>
        Require all granted
        Options -Indexes
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /v1/ http://127.0.0.1:8787/v1/ connectiontimeout=5 timeout=30
    ProxyPassReverse /v1/ http://127.0.0.1:8787/v1/
    ProxyPass        /health http://127.0.0.1:8787/health connectiontimeout=5 timeout=30
    ProxyPassReverse /health http://127.0.0.1:8787/health

    ErrorLog ${APACHE_LOG_DIR}/atlas-sync-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/atlas-sync-ssl-access.log combined

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/__ATLAS_HOSTNAME__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__ATLAS_HOSTNAME__/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>

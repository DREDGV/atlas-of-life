name: Revival baseline

on:
  pull_request:
    branches:
      - revival-preparation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Verify revival baseline
        run: powershell -ExecutionPolicy Bypass -File tools\verify-baseline.ps1
